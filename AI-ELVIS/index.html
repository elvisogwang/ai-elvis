<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-ELVIS v1.0</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(
-45deg,
#ff0000,
#ff7300,
#fffb00,
#48ff00,
#00ffd5,
#002bff,
#7a00ff,
#ff00c8
);
background-size:400% 400%;
animation:rainbow 10s ease infinite;
}

@keyframes rainbow{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
width:95%;
max-width:1200px;
background:rgba(0,0,0,0.75);
backdrop-filter:blur(15px);
padding:25px;
border-radius:25px;
box-shadow:0 0 30px rgba(255,255,255,0.3);
}

.logo{
text-align:center;
font-size:3rem;
font-weight:bold;
animation:neon 3s infinite;
margin-bottom:10px;
}

@keyframes neon{
0%{color:#ff0000;text-shadow:0 0 20px #ff0000;}
20%{color:#00ffff;text-shadow:0 0 20px #00ffff;}
40%{color:#00ff00;text-shadow:0 0 20px #00ff00;}
60%{color:#ffff00;text-shadow:0 0 20px #ffff00;}
80%{color:#ff00ff;text-shadow:0 0 20px #ff00ff;}
100%{color:#ff0000;text-shadow:0 0 20px #ff0000;}
}

.version{
text-align:center;
color:white;
margin-bottom:20px;
}

.top-bar{
display:flex;
gap:10px;
margin-bottom:20px;
}

.search{
flex:1;
padding:15px;
border:none;
border-radius:50px;
font-size:16px;
outline:none;
}

.btn{
padding:15px 20px;
border:none;
border-radius:50px;
cursor:pointer;
font-weight:bold;
background:linear-gradient(45deg,#00ffff,#ff00ff);
color:white;
}

.response-area{
height:350px;
overflow-y:auto;
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:15px;
color:white;
margin-bottom:20px;
}

.input-section{
display:flex;
gap:10px;
}

.input-box{
flex:1;
padding:15px;
border:none;
border-radius:15px;
font-size:16px;
}

.dark-mode{
background:#111;
}

.dark-mode .container{
background:rgba(20,20,20,0.95);
}

.footer{
text-align:center;
color:white;
margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">ELVIS</div>

<div class="version">
AI-ELVIS v1.0<br>
Physics & Mathematics AI Assistant
</div>

<div class="top-bar">
<input type="text" class="search" placeholder="Search physics or mathematics questions...">

<button class="btn" onclick="toggleDarkMode()">
🌙 Dark Mode
</button>
</div>

<div class="response-area" id="responseArea">
<h3>Welcome to AI-ELVIS</h3>
<p>
Ask any Physics, Mathematics, Algebra, Calculus,
Trigonometry, Statistics, or Engineering question.
</p>
</div>

<div class="input-section">

<input type="file" id="fileUpload">

<input
type="text"
id="question"
class="input-box"
placeholder="Enter your math or physics problem...">

<button class="btn" onclick="solveProblem()">
Solve
</button>


</div>

<div class="footer">
© 2026 AI-ELVIS | Advanced Physics & Mathematics Solver
</div>

</div>

<script>
async function solveProblem(){

const question =
document.getElementById("question").value;

const responseArea =
document.getElementById("responseArea");

if(question.trim() === ""){
responseArea.innerHTML =
"<h3>Please enter a question.</h3>";
return;
}

responseArea.innerHTML =
"<h3>Thinking...</h3>";

try{

const res = await fetch(
"http://localhost:5000/api/solve",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({ question })
}
);

const data = await res.json();

responseArea.innerHTML = `
<h3>AI-ELVIS Analysis</h3>

<p><strong>Question:</strong> ${data.question}</p>

<hr>

<p><strong>Answer:</strong></p>
<pre>${data.answer}</pre>
`;

}
catch(err){

responseArea.innerHTML =
"<h3>Error connecting to AI backend</h3>";

}
}

</script>
<button onclick="startVoice()">🎤 Speak</button>

<script>
function startVoice() {
  const recognition =
    new webkitSpeechRecognition();

  recognition.start();

  recognition.onresult = function(event) {
    document.getElementById("question").value =
      event.results[0][0].transcript;
  };
}
async function askAI() {
  const question = document.getElementById("question").value;

  const response = await fetch(
    "https://your-backend-url.onrender.com/ask",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prompt: question
      })
    }
  );

  const data = await response.json();

  document.getElementById("answer").innerHTML =
    data.answer || data.error;
}
</script>
</body>
</html>
